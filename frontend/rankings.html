<!DOCTYPE html>
<html>
<head>
    <title>Exoplanet Rankings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Top Most 10 Exoplanet Habitability Rankings</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Planet Name</th>
                <th>Temperature (K)</th>
                <th>Orbital Period </th>
                <th>Radius</th>
                <th>Habitability Score</th>
            </tr>
        </thead>
        <tbody>
            {% for planet in ranking %}
            <tr>
                <td>{{ planet[name_col] }}</td>
                <td>{{ planet.pl_eqt }}</td>
                <td>{{ planet.pl_orbper }}</td>
                <td>{{ planet.pl_radj }}</td>
                <td>{{ planet.Habitability_Score }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/" class="btn btn-primary">⬅ Back to Home</a>
</div>

</body>
</html>
