<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExoExplore - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Fallback dark theme */
        body {
            background-color: #0b0e14;
            color: #ffffff;
        }

        .chart-card {
            background-color: #151a21;
            color: white;
        }

        .table-dark {
            --bs-table-bg: #151a21;
            color: #a0a0a0;
        }

        .table-dark th {
            color: #00d2ff;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-planet"></i> ExoExplore</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/exoplanets">What Are Exoplanets</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
                </ul>
            </div>
        </div>

        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="text-center hero-title fs-2 mb-5">Data Visualizations</h2>

        <div class="row mb-5">
            <div class="col-md-6">
                <div class="chart-card">
                    <h5 class="chart-title">Feature Importance</h5>
                    <div style="height: 300px; width: 100%;">
                        <canvas id="featureChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-card">
                    <h5 class="chart-title">Habitability Distribution</h5>
                    <div style="height: 300px; display: flex; justify-content: center;">
                        <canvas id="distributionChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col-12">
                <div class="chart-card">
                    <h5 class="chart-title">Star-Planet Relationship</h5>
                    <div style="height: 400px; width: 100%;">
                        <canvas id="scatterChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="chart-card">
                    <h5 class="chart-title text-start ps-3 border-bottom pb-3">Top Habitable Candidates</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Planet Name</th>
                                    <th>Habitability Score</th>
                                    <th>Distance (LY)</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="candidatesTableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
    <script>
        // Init dashboard when loaded
        document.addEventListener('DOMContentLoaded', () => {
            if (document.getElementById('featureChart')) {
                loadDashboardData();
            }
        });
    </script>
</body>

</html>
