<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
let importanceChart = null;
let isPredicting = false;

// Load top planets on start - FIXED NaN!
async function loadTopPlanets() {
    try {
        const response = await fetch('/api/top-habitable');
        const data = await response.json();
        
        if (data.status === 'success' && data.top_habitable_planets) {
            displayTopPlanets(data.top_habitable_planets);
        }
    } catch (e) {
        console.error('Top planets error:', e);
    }
}

function displayTopPlanets(planets) {
    const tbody = document.querySelector('#topPlanetsTable tbody');
    tbody.innerHTML = '';
    
    planets.forEach(planet => {
        // FIXED: Proper field names + null checks
        const score = planet.habitability_score || 0;
        const rfProb = planet.rf_probability || 0;
        const planetClass = planet.classification || 'Unknown';
        
        tbody.innerHTML += `
            <tr>
                <td class="fw-bold text-primary">${planet.rank}</td>
                <td><strong>${planet.planet_name}</strong></td>
                <td><span class="badge bg-success">${(score*100).toFixed(1)}%</span></td>
                <td class="fw-semibold">${(rfProb*100).toFixed(1)}%</td>
                <td><span class="badge bg-primary">${planetClass}</span></td>
            </tr>
        `;
    });
}

// Predict button - FIXED null errors
document.getElementById('planetForm').addEventListener('submit', async (e) => {
    if (isPredicting) return;
    
    e.preventDefault();
    isPredicting = true;
    
    const predictBtn = document.getElementById('predictBtn');
    predictBtn.disabled = true;
    predictBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Predicting...';
    
    const formData = {
        planet_name: 'Your Exoplanet',  // Add planet name
        pl_rade: parseFloat(document.getElementById('pl_rade').value) || 1.0,
        pl_bmasse: parseFloat(document.getElementById('pl_bmasse').value) || 1.0,
        pl_dens: parseFloat(document.getElementById('pl_dens').value) || 5.51,
        pl_eqt: parseFloat(document.getElementById('pl_eqt').value) || 255,
        pl_orbper: parseFloat(document.getElementById('pl_orbper').value) || 365,
        sy_dist: parseFloat(document.getElementById('sy_dist').value) || 10,
        st_lum: parseFloat(document.getElementById('st_lum').value) || 0,
        st_teff: parseFloat(document.getElementById('st_teff').value) || 5772,
        st_met: parseFloat(document.getElementById('st_met').value) || 0,
        st_spectype: document.getElementById('st_spectype').value || 'G'
    };
    
    try {
        const response = await fetch('/api/predict', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
            displayResults(result.data);
            document.getElementById('resultsCard').scrollIntoView({behavior: 'smooth'});
        } else {
            alert('Error: ' + (result.message || 'Prediction failed'));
        }
    } catch (error) {
        alert('Connection error: ' + error.message);
    } finally {
        isPredicting = false;
        predictBtn.disabled = false;
        predictBtn.innerHTML = '<i class="fas fa-brain me-2"></i>Predict Habitability';
    }
});

function displayResults(data) {
    document.getElementById('resultsCard').style.display = 'block';
    
    // Update scores
    const finalScore = data.habitability_scores.final_habitability_score;
    document.getElementById('finalScore').textContent = (finalScore * 100).toFixed(1) + '%';
    
    document.getElementById('rfProb').textContent = (data.rf_prediction.probability * 100).toFixed(1) + '%';
    document.getElementById('xgbClass').textContent = data.xgb_prediction.class_name;
    
    // Update planet name
    document.getElementById('planetNameDisplay').textContent = data.planet_name || 'Your Exoplanet';
    
    // Show Earth comparison table
    updateEarthComparison(data.earth_comparison);
    
    // FORCE 5 BARS TO SHOW
    updateImportanceChart(data.feature_importance);
}

// FIXED: 5 Bars ALWAYS show
function updateImportanceChart(importance) {
    const canvas = document.getElementById('importanceChart');
    const ctx = canvas.getContext('2d');
    
    if (importanceChart) importanceChart.destroy();
    
    const labels = Object.keys(importance.earth_similarity || {});
    const dataValues = Object.values(importance.earth_similarity || [0.5,0.5,0.5,0.5,0.5]);
    
    importanceChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels.length ? labels : FEATURE_NAMES,
            datasets: [{
                label: 'Earth Similarity %',
                data: dataValues,
                backgroundColor: [
                    'rgba(75, 192, 192, 0.8)', 'rgba(54, 162, 235, 0.8)', 
                    'rgba(255, 206, 86, 0.8)', 'rgba(153, 102, 255, 0.8)', 'rgba(255, 159, 64, 0.8)'
                ],
                borderColor: 'rgba(0,0,0,0.1)',
                borderWidth: 2,
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { beginAtZero: true, max: 1, title: { display: true, text: 'Similarity to Earth' } },
                y: { title: { display: true, text: 'Features' } }
            }
        }
    });
}

function updateEarthComparison(comparison) {
    const tableBody = document.getElementById('earthComparisonTable');
    if (!tableBody) return;
    
    tableBody.innerHTML = `
        <tr><td><strong>${comparison.your_planet}</strong></td><td>${comparison.your_values.radius.toFixed(1)}</td><td>${comparison.your_values.mass.toFixed(1)}</td><td>${comparison.your_values.density.toFixed(2)}</td><td>${comparison.your_values.temp.toFixed(0)}</td><td>${comparison.your_values.orbit.toFixed(1)}</td></tr>
        <tr class="table-info"><td><strong>Earth</strong></td><td>1.0</td><td>1.0</td><td>5.51</td><td>255</td><td>365.3</td></tr>
    `;
}

// Initialize
loadTopPlanets();
</script>
